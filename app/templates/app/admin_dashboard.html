<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>
    {% include 'app/base.html' %}
    <div class="container">
        <h1>Admin Dashboard</h1>
        <button type="button" class="btn btn-primary" data-toggle="modal" data-target="#createUserModal">Crear Nuevo Usuario</button>
        <button type="button" class="btn btn-success" data-toggle="modal" data-target="#createClassModal">Crear Nueva Clase</button>
        <form id="logout-form" action="{% url 'logout' %}" method="POST" style="display: inline;">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Cerrar Sesión</button>
        </form>
        {% include 'app/create_user.html' %}
        {% include 'app/create_class.html' %}
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.3/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

    <script>
        $(document).ready(function(){
            $('#createUserModal').on('show.bs.modal', function () {
                $('#createClassModal').modal('hide');
            });

            $('#createClassModal').on('show.bs.modal', function () {
                $('#createUserModal').modal('hide');
            });
        });
    </script>
</body>
</html>
