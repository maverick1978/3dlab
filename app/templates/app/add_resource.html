{% extends "base.html" %}
{% block content %}
<h2>Agregar Recurso a {{ class.name }}</h2>
<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Agregar Recurso</button>
</form>
<a href="{% url 'view_class' class.id %}" class="btn btn-secondary">Volver a la Clase</a>
{% endblock %}
